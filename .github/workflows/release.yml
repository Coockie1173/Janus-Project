name: release

# A push to main replaces the "latest" release, a pushed tag (v1.0) gets its own.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # the build needs the disc, so it runs on a machine that has one (README, Releases)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false    # build/ stays between runs: only what changed is rebuilt
          fetch-depth: 0  # the tags too: the version in the game comes from them

      - name: wiikit, pristine for the patch
        run: |
          git submodule update --init --force
          git -C wiikit clean -q -fdx

      - name: TASLib, private, its built library ships when the runner can fetch it
        run: |
          git submodule update --init --checkout TASLib || echo "no access to TASLib: released without it"

      - name: disc and modpacks
        run: |
          test -f "$GE_GAME/sys/main.dol" || { echo "GE_GAME in the runner's .env has to be an extracted disc"; exit 1; }
          ln -sfn "$GE_GAME" game
          # GE_MODPACKS: the modpacks folder, each pack in it is a zip of its own in the release.
          # an older runner's GE_MODS (one mods folder) is the pack "default"
          rm -rf modpacks mods
          if [ -n "$GE_MODPACKS" ]; then ln -sfn "$GE_MODPACKS" modpacks
          elif [ -n "$GE_MODS" ]; then mkdir modpacks && ln -sfn "$GE_MODS" modpacks/default; fi

      - run: make linux
      - run: make win
      - run: make mods-zip

      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh tools/publish_release.sh build/Janus-Project-linux64.zip build/Janus-Project-win64.zip build/modpacks/*.zip
